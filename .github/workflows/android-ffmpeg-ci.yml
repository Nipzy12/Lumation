name: Android FFmpeg module

on:
  push:
    branches: [feat/android-ffmpeg]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ffmpeg-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android library
        run: gradle -p android :ffmpeg:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lumation-ffmpeg-aar
          path: android/ffmpeg/build/outputs/aar/*.aar
          if-no-files-found: error
